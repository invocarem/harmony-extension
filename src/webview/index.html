<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony</title>
    <link rel="stylesheet" href="{{stylesUri}}">
</head>
<body>
    <div class="chat-container">
        <div class="stage-indicator">
            <div class="stage-light" id="stage-light-chat" title="Chat/Reasoning">
                <div class="light-bulb"></div>
                <span class="stage-label">Chat</span>
            </div>
            <div class="stage-arrow" id="arrow-chat-to-assumptions" title="Move to Assumptions" data-from="chat" data-to="assumptions">→</div>
            <div class="stage-light" id="stage-light-assumptions" title="Assumptions/Analysis">
                <div class="light-bulb"></div>
                <span class="stage-label">Assumptions</span>
            </div>
            <div class="stage-arrow" id="arrow-assumptions-to-implementation" title="Move to Implementation" data-from="assumptions" data-to="implementation">→</div>
            <div class="stage-light" id="stage-light-implementation" title="Implementation">
                <div class="light-bulb"></div>
                <span class="stage-label">Implementation</span>
            </div>
            <div class="stage-arrow" id="button-next-step" title="Next Step">⏭</div>
        </div>
        <div id="messages" class="messages"></div>
        <div class="input-container">
            <div class="shortcut-hint" id="shortcutHint">Ctrl+F to insert file</div>
            <textarea id="messageInput" placeholder="Type your message... Use @file to include file context..." autofocus rows="3"></textarea>
            <button id="sendButton">Send</button>
            <button id="contextButton" title="Send current file context">📄</button>
            <button id="fileButton" title="Insert file reference">📁</button>
            <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
        </div>
    </div>
    <script src="{{scriptUri}}"></script>
</body>
</html>
